<section id="{{metadata.slug}}-page" class="page-content">
    <div class="page-layout">
        <div class="page-main">
            <div class="page-header">
                <h1>{{metadata.title}}</h1>
            </div>

            <!-- Table of Contents (Mobile/Tablet) -->
            <aside class="toc-mobile" aria-labelledby="toc-{{metadata.slug}}-mobile-heading">
                <h2 id="toc-{{metadata.slug}}-mobile-heading" class="toc-heading">Page Contents</h2>
                <nav class="toc-nav">
                    <ul class="toc-list" id="toc-{{metadata.slug}}-list-mobile">
                        <!-- Generated by JavaScript -->
                    </ul>
                </nav>
            </aside>

            <div class="page-text">{{content}}</div>
        </div>

        <!-- Table of Contents (Desktop Sidebar) -->
        <aside class="toc-sidebar" aria-labelledby="toc-{{metadata.slug}}-sidebar-heading">
            <div class="toc-container">
                <h2 id="toc-{{metadata.slug}}-sidebar-heading" class="toc-heading">Page Contents</h2>
                <nav class="toc-nav">
                    <ul class="toc-list" id="toc-{{metadata.slug}}-list-desktop">
                        <!-- Generated by JavaScript -->
                    </ul>
                </nav>
            </div>
        </aside>
    </div>
</section>
